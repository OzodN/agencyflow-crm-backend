spring:
  application:
    name: agencyflow-crm

  security:
    user:
      name: ${BASIC_AUTH_USER:}
      password: ${BASIC_AUTH_PASSWORD:}
  datasource:
    url: ${DATABASE_URL}
    username: ${PGUSER}
    password: ${PGPASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}